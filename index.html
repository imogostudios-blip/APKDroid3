<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>APKDroid Store</title>

<!-- PWA: name, icon, install behavior -->
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#02C57A"/>
<meta name="application-name" content="APKDroid"/>
<meta name="apple-mobile-web-app-title" content="APKDroid"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="icon" type="image/png" sizes="192x192" href="res/icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="res/icons/icon-512.png"/>
<link rel="apple-touch-icon" href="res/icons/icon-192.png"/>
<link rel="shortcut icon" href="favicon.png"/>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:{DEFAULT:'hsl(157 98% 39%)',foreground:'#fff'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}
</script>

<!-- All original CSS, split into its own file -->
<link rel="stylesheet" href="res/css/styles.css"/>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- All original app logic, unmodified, split into its own file -->
<script type="text/babel" src="src/app.jsx"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
